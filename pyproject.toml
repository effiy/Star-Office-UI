[project]
name = "star-office-ui"
version = "0.1.0"
description = "Star Office UI - Backend State Service"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fakeredis[lua]>=2.40.0",
    "fastapi>=0.162.0",
    "flask>=3.0.0",
    "python-multipart>=0.0.32",
    "redis[hiredis]>=8.1.0",
    "sse-starlette>=3.5.1",
    "uvicorn[standard]>=0.54.0",
    "watchdog>=6.0.0",
    "websockets>=12.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["backend/tests"]
markers = [
    "slow: 慢测试（高并发等），CI 中可选跳过",
    "asyncio: 异步测试",
]
